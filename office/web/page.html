<title>가상 사무실 — 대표 전용</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f3ec; --surface:#ffffff; --surface2:#efe9db; --text:#1c1b22; --muted:#5a5768;
  --border:#d6cdb8; --accent:#7a4e00; --accent-bg:#fff1cc; --focus:#1d4ed8;
  --danger:#b3261e; --danger-bg:#fde8e6; --ok:#1b6b39; --ok-bg:#e2f4e8;
  --warn:#7a4e00; --warn-bg:#fff1cc; --info:#1e4fa3; --info-bg:#e5eefc;
  --gray:#5f5c6b; --gray-bg:#e9e6ee; --stage:#14172b; --shadow:0 6px 24px rgba(20,20,40,.18);
  --sample:#5b21b6; --sample-fg:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10121e; --surface:#191c2e; --surface2:#232741; --text:#ece8f6; --muted:#a9a5bd;
    --border:#34385a; --accent:#f0c35a; --accent-bg:#3a2f12; --focus:#8fb4ff;
    --danger:#ff9a90; --danger-bg:#431a18; --ok:#7fdca0; --ok-bg:#12341f;
    --warn:#f0c35a; --warn-bg:#3a2f12; --info:#9fc0ff; --info-bg:#16284d;
    --gray:#b4b0c4; --gray-bg:#2a2d45; --stage:#0b0d18; --shadow:0 6px 24px rgba(0,0,0,.6);
    --sample:#c4b5fd; --sample-fg:#1a1033;
  }
}
:root[data-theme="dark"]{
  --bg:#10121e; --surface:#191c2e; --surface2:#232741; --text:#ece8f6; --muted:#a9a5bd;
  --border:#34385a; --accent:#f0c35a; --accent-bg:#3a2f12; --focus:#8fb4ff;
  --danger:#ff9a90; --danger-bg:#431a18; --ok:#7fdca0; --ok-bg:#12341f;
  --warn:#f0c35a; --warn-bg:#3a2f12; --info:#9fc0ff; --info-bg:#16284d;
  --gray:#b4b0c4; --gray-bg:#2a2d45; --stage:#0b0d18; --shadow:0 6px 24px rgba(0,0,0,.6);
  --sample:#c4b5fd; --sample-fg:#1a1033;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.55 "Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sample-bar{position:sticky;top:0;z-index:80;background:var(--sample);color:var(--sample-fg);
  font-weight:700;text-align:center;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.sample-bar button{background:transparent;border:1px solid currentColor;border-radius:8px;padding:4px 12px;min-height:36px;cursor:pointer}
.wrap{max-width:1360px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
h1{font-size:20px;margin:0;line-height:1.3}
.sub{color:var(--muted);font-size:14px}
.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px;padding:0;list-style:none}
@media(min-width:720px){.summary{grid-template-columns:repeat(4,minmax(0,1fr))}}
.summary li{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px}
.summary .k{display:block;color:var(--muted);font-size:13px}
.summary .v{font-size:22px;font-weight:700}
.summary .v small{font-size:14px;font-weight:500;color:var(--muted)}
.summary li.alert{border-color:var(--warn);background:var(--warn-bg)}
.banner{border-radius:12px;padding:10px 14px;margin:0 0 12px;border:1px solid var(--border);background:var(--info-bg);color:var(--text)}
.banner.warn{background:var(--warn-bg);border-color:var(--warn)}
.banner.bad{background:var(--danger-bg);border-color:var(--danger)}
.banner b{display:block}
.banner button{margin-top:8px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--accent);background:var(--surface);cursor:pointer;font-weight:600}
.layout{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.layout{grid-template-columns:minmax(0,1fr) 390px;align-items:start}}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;min-height:44px;padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.stage{position:relative;width:100%;height:340px;background:var(--stage);border:1px solid var(--border);border-radius:12px;overflow:hidden;touch-action:manipulation}
.stage canvas{display:block}
@media(min-width:720px){.stage{height:auto;aspect-ratio:3/2}}
.stage .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;text-align:center;color:#e6e2f2}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-top:14px}
.panel h2{font-size:16px;margin:0 0 8px}
.legend{margin:0;padding:0;list-style:none;display:grid;gap:4px 16px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));font-size:14px}
.legend li{display:flex;gap:8px;align-items:baseline}
.note{color:var(--muted);font-size:14px;margin:8px 0 0}
.slist{list-style:none;margin:0;padding:0;display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.srow{width:100%;text-align:left;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;min-height:52px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);cursor:pointer}
.srow[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.srow .nm{font-weight:700;display:block}
.srow .tt{font-size:13px;color:var(--muted);display:block}
.chip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.chip.work{color:var(--ok);background:var(--ok-bg)}
.chip.err{color:var(--danger);background:var(--danger-bg)}
.chip.wait{color:var(--warn);background:var(--warn-bg)}
.chip.done{color:var(--info);background:var(--info-bg)}
.chip.gray{color:var(--gray);background:var(--gray-bg)}
.srow .chip{margin-left:auto}
.srow>span:first-child{flex:1 1 120px;min-width:0}
aside.side{position:fixed;left:0;right:0;bottom:0;z-index:70;max-height:74vh;overflow:auto;background:var(--surface);
  border:1px solid var(--border);border-bottom:0;border-radius:16px 16px 0 0;box-shadow:var(--shadow);
  padding:12px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:960px){
  aside.side{position:sticky;top:56px;left:auto;right:auto;bottom:auto;max-height:calc(100vh - 72px);border-radius:12px;border-bottom:1px solid var(--border);padding:14px 16px;z-index:5}
}
.side-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;position:sticky;top:-12px;background:var(--surface);padding-bottom:6px}
.side-head h2{margin:0;font-size:18px}
.close{min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-weight:700}
.side h3{font-size:14px;margin:14px 0 4px;color:var(--muted);letter-spacing:.02em}
.side dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:0}
.side dt{color:var(--muted)}
.side dd{margin:0;overflow-wrap:anywhere}
.side ul{margin:0;padding-left:18px}
.side li{overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--gray-bg);overflow:hidden;border:1px solid var(--border)}
.bar>i{display:block;height:100%;background:var(--ok)}
.card{border:1px solid var(--border);border-radius:10px;padding:8px 10px;margin:6px 0;background:var(--surface2)}
.rule{color:var(--warn);font-weight:600}
.empty{color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
</style>
<div id="root"><p style="padding:16px">가상 사무실을 불러오는 중…</p></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="art.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
