<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>가상 사무실 그림 확인 (art.js · map.js)</title>
<!--
  디자인 실장 확인용 페이지(게시하지 않음). art.js·map.js 만 불러와 순수 캔버스로 그린다.
  주소 옵션: ?only=scene|map|chars|cat|tiles|icons  (한 부분만)  &ids=ceo,main (캐릭터 고르기)
             &grid=1 (통행 불가 칸·자리·spot 표시)  &s=배율
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 16px 20px 40px; background: #12162b; color: #efe6cf; font: 13px/1.5 system-ui, "Noto Sans KR", sans-serif; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #e8c66e; }
  h2 { font-size: 15px; margin: 28px 0 8px; color: #e8c66e; border-bottom: 1px solid #2b3a6e; padding-bottom: 4px; }
  p.note { margin: 0 0 8px; color: #b9b2a0; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .wrap { display: flex; flex-wrap: wrap; gap: 14px 18px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 3px; }
  .cell span { font-size: 11px; color: #b9b2a0; max-width: 160px; }
  .row { display: flex; gap: 14px; align-items: flex-end; margin-bottom: 10px; padding: 8px; background: #1a2040; border-radius: 6px; }
  .row .name { width: 150px; flex: none; font-size: 12px; }
  .row .name b { display: block; color: #f5e2a6; }
  .anim { display: flex; flex-direction: column; gap: 2px; }
  .anim .fr { display: flex; gap: 2px; }
  .anim small { font-size: 10px; color: #9c96a8; }
  #err { color: #ff9b8a; white-space: pre-wrap; }
  .bg-light { background: #ece1c7; }
</style>
</head>
<body>
<h1>가상 사무실 그림 확인</h1>
<p class="note">art.js · map.js 만으로 그린 확인용 화면입니다. 복자(고양이)의 움직임은 장식이며 업무와 무관합니다.</p>
<div id="err"></div>
<div id="out"></div>
<script src="art.js"></script>
<script src="map.js"></script>
<script>
(function () {
  'use strict';
  var ART = window.OFFICE_ART, MAP = window.OFFICE_MAP;
  var out = document.getElementById('out'), errBox = document.getElementById('err');
  if (!ART || !MAP) { errBox.textContent = 'art.js 또는 map.js 를 불러오지 못했습니다.'; return; }
  var Q = new URLSearchParams(location.search);
  var ONLY = Q.get('only'), GRID = Q.get('grid') === '1';
  var TS = ART.tile;
  var cache = {};

  // 프레임(문자열 배열) → 캔버스(1배)
  function frameCanvas(F, w, h) {
    var key = F.join('\n');
    if (cache[key]) return cache[key];
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var cx = cv.getContext('2d'), img = cx.createImageData(w, h);
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var hex = ART.palette[F[y].charAt(x)];
      if (!hex) continue;
      var i = (y * w + x) * 4;
      img.data[i] = parseInt(hex.slice(1, 3), 16); img.data[i + 1] = parseInt(hex.slice(3, 5), 16);
      img.data[i + 2] = parseInt(hex.slice(5, 7), 16); img.data[i + 3] = 255;
    }
    cx.putImageData(img, 0, 0);
    return (cache[key] = cv);
  }
  function scaled(F, w, h, s, bg) {
    var cv = document.createElement('canvas'); cv.width = w * s; cv.height = h * s;
    var cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
    if (bg) { cx.fillStyle = bg; cx.fillRect(0, 0, cv.width, cv.height); }
    cx.drawImage(frameCanvas(F, w, h), 0, 0, w * s, h * s);
    return cv;
  }
  function section(title, note) {
    var h = document.createElement('h2'); h.textContent = title; out.appendChild(h);
    if (note) { var p = document.createElement('p'); p.className = 'note'; p.textContent = note; out.appendChild(p); }
    var d = document.createElement('div'); d.className = 'wrap'; out.appendChild(d); return d;
  }
  function show(name) { return !ONLY || ONLY === name; }

  /* ── 지도 그리기 ── */
  function drawMap(s, withScene) {
    var cv = document.createElement('canvas'); cv.width = MAP.cols * TS * s; cv.height = MAP.rows * TS * s;
    var cx = cv.getContext('2d'); cx.imageSmoothingEnabled = false;
    cx.fillStyle = '#14172b'; cx.fillRect(0, 0, cv.width, cv.height);
    function tileAt(ch) { var k = MAP.legend[ch]; return k && ART.tiles[k]; }
    MAP.layers.floor.forEach(function (row, y) {
      for (var x = 0; x < row.length; x++) { var t = tileAt(row[x]); if (t) cx.drawImage(frameCanvas(t.frames[0], t.w, t.h), x * TS * s, y * TS * s, t.w * s, t.h * s); }
    });
    // 가구와 인물은 아래 가장자리(y) 순서로
    var items = [];
    MAP.layers.furniture.forEach(function (row, y) {
      for (var x = 0; x < row.length; x++) {
        if (row[x] === '.') continue; var t = tileAt(row[x]); if (!t) continue;
        items.push({ d: y * TS + t.h - TS, draw: (function (t, x, y) { return function () { cx.drawImage(frameCanvas(t.frames[0], t.w, t.h), x * TS * s, y * TS * s, t.w * s, t.h * s); }; })(t, x, y) });
      }
    });
    if (withScene) sceneItems(items, cx, s);
    items.sort(function (a, b) { return a.d - b.d; }).forEach(function (it) { it.draw(); });
    if (GRID) {
      MAP.walkable.forEach(function (row, y) { for (var x = 0; x < row.length; x++) if (row[x] === '#') { cx.fillStyle = 'rgba(255,80,60,.22)'; cx.fillRect(x * TS * s, y * TS * s, TS * s, TS * s); } });
      cx.lineWidth = 2;
      Object.keys(MAP.desks).forEach(function (id) { var d = MAP.desks[id]; cx.strokeStyle = '#7cf'; cx.strokeRect(d.x * TS * s + 2, d.y * TS * s + 2, TS * s - 4, TS * s - 4); });
      ['meeting', 'lounge'].forEach(function (k) { MAP.spots[k].forEach(function (p) { cx.strokeStyle = k === 'meeting' ? '#fd6' : '#9f9'; cx.strokeRect(p.x * TS * s + 5, p.y * TS * s + 5, TS * s - 10, TS * s - 10); }); });
      [MAP.spots.ceoBell, MAP.spots.door].forEach(function (p) { cx.strokeStyle = '#f6f'; cx.strokeRect(p.x * TS * s + 1, p.y * TS * s + 1, TS * s - 2, TS * s - 2); });
      MAP.catRoutes.forEach(function (rt, i) {
        cx.strokeStyle = ['#ff0', '#0ff', '#f0f'][i]; cx.beginPath();
        rt.forEach(function (p, j) { var X = (p.x + .5) * TS * s + i * 3, Y = (p.y + .5) * TS * s + i * 3; if (j) cx.lineTo(X, Y); else cx.moveTo(X, Y); }); cx.stroke();
      });
    }
    MAP.rooms.forEach(function (r) {
      cx.font = (5 * s) + 'px system-ui, sans-serif'; cx.fillStyle = '#f4e6b8'; cx.strokeStyle = '#10121e'; cx.lineWidth = s;
      cx.strokeText(r.name, r.x * TS * s + 3 * s, r.y * TS * s + 7 * s); cx.fillText(r.name, r.x * TS * s + 3 * s, r.y * TS * s + 7 * s);
    });
    return cv;
  }
  // 장면 예시: 자리마다 앉은 직원(일부 타이핑·읽기), 회의실·휴게실 몇 명, 복자
  function sceneItems(items, cx, s) {
    var pose = { ceo: 'sit', main: 'type', 'business-strategist': 'read', 'saju-engine-developer': 'type', 'frontend-developer': 'type',
      'backend-developer': 'sit', 'qa-security-lead': 'read', 'myeongri-research-director': 'read', 'personalization-researcher': 'type',
      'design-director': 'type', 'content-writer': 'read' };
    function sprite(id, an, fi, x, y, seated, flip) {
      var c = ART.characters[id], F = c.anims[an].frames[fi % c.anims[an].frames.length];
      var px = x * TS + TS / 2 - c.w / 2, py = (y + 1) * TS - c.h + (seated ? 2 : 0);
      items.push({ d: (y + 1) * TS + (seated ? 2 + 16 : 0), draw: function () {
        cx.save();
        if (flip) { cx.translate((px + c.w) * s, 0); cx.scale(-1, 1); cx.drawImage(frameCanvas(F, c.w, c.h), 0, py * s, c.w * s, c.h * s); }
        else cx.drawImage(frameCanvas(F, c.w, c.h), px * s, py * s, c.w * s, c.h * s);
        cx.restore();
        var ic = { type: 'typing', read: 'research', sit: 'done' }[an];
        if (ic && seated) { var I = ART.icons[ic]; cx.drawImage(frameCanvas(I.frames[0], 12, 12), (x * TS + 2) * s, (py - 13) * s, 12 * s, 12 * s); }
      } });
    }
    Object.keys(pose).forEach(function (id, i) { var d = MAP.desks[id]; sprite(id, pose[id], i, d.x, d.y, true, d.facing === 'left'); });
    // 회의실 2명 + 휴게실 손님 + 걸어가는 사람
    sprite('guest', 'idle', 0, MAP.spots.lounge[6].x, MAP.spots.lounge[6].y, false);
    sprite('main', 'walkSide', 0, 12, 12, false);
    sprite('qa-security-lead', 'walkUp', 0, 20, 15, false);
    sprite('content-writer', 'walk', 0, 30, 21, false);
    var cat = ART.cat;
    [['sleep', 34, 22], ['walkSide', 25, 12], ['sit', 9, 8]].forEach(function (c) {
      var F = cat.anims[c[0]].frames[0], px = c[1] * TS, py = (c[2] + 1) * TS - cat.h;
      items.push({ d: (c[2] + 1) * TS + 1, draw: function () { cx.drawImage(frameCanvas(F, cat.w, cat.h), px * s, py * s, cat.w * s, cat.h * s); } });
    });
  }

  try {
    var ms = +(Q.get('s') || 2);
    if (show('scene')) section('장면 예시', '직원이 자리에 앉아 일하는 모습(예시 배치, 실제 업무 아님). 앉은 사람은 의자 칸에서 책상(아래 칸)을 마주 봅니다.').appendChild(drawMap(ms, true));
    if (show('map')) section('지도 ' + MAP.cols + '×' + MAP.rows + ' 타일', GRID ? '붉은 칸 = 통행 불가 · 파랑 = 자리 · 노랑 = 회의 spot · 초록 = 휴게 spot · 분홍 = 벨/정문 · 선 = 복자 경로' : '?grid=1 을 붙이면 통행 격자·자리·경로를 겹쳐 봅니다.').appendChild(drawMap(ms, false));

    if (show('chars')) {
      var cs = +(Q.get('s') || 4);
      var sec = section('캐릭터 12종 (16×24)', '애니메이션: idle · walk(앞) · walkSide(오른쪽, 왼쪽은 좌우반전) · walkUp(뒤) · sit · type · read');
      sec.style.display = 'block';
      var IDS = Q.get('ids') ? Q.get('ids').split(',') : Object.keys(ART.characters);
      IDS.forEach(function (id) {
        var c = ART.characters[id], row = document.createElement('div'); row.className = 'row';
        var nm = document.createElement('div'); nm.className = 'name'; nm.innerHTML = '<b>' + id + '</b>' + ((ART.notes && ART.notes[id]) || ''); row.appendChild(nm);
        Object.keys(c.anims).forEach(function (an) {
          var a = c.anims[an], box = document.createElement('div'); box.className = 'anim';
          var fr = document.createElement('div'); fr.className = 'fr';
          var uniq = []; a.frames.forEach(function (F) { if (uniq.indexOf(F) < 0) uniq.push(F); });
          uniq.forEach(function (F) { fr.appendChild(scaled(F, c.w, c.h, cs, '#2b3a6e')); });
          var lb = document.createElement('small'); lb.textContent = an + ' ' + a.frames.length + '프레임 ' + a.fps + 'fps';
          box.appendChild(fr); box.appendChild(lb); row.appendChild(box);
        });
        sec.appendChild(row);
      });
    }
    if (show('cat')) {
      var sec2 = section('복자 — 턱시도 고양이 (16×16, 장식)');
      Object.keys(ART.cat.anims).forEach(function (an) {
        var a = ART.cat.anims[an], box = document.createElement('div'); box.className = 'cell';
        var fr = document.createElement('div'); fr.style.display = 'flex'; fr.style.gap = '3px';
        var uniq = []; a.frames.forEach(function (F) { if (uniq.indexOf(F) < 0) uniq.push(F); });
        uniq.forEach(function (F) { fr.appendChild(scaled(F, 16, 16, 5, '#ad804d')); });
        var lb = document.createElement('span'); lb.textContent = an + ' (' + a.frames.length + '프레임)';
        box.appendChild(fr); box.appendChild(lb); sec2.appendChild(box);
      });
    }
    if (show('tiles')) {
      var sec3 = section('타일·가구 (' + Object.keys(ART.tiles).length + '종)', '투명 부분은 체크 무늬 위에 보입니다.');
      Object.keys(ART.tiles).forEach(function (k) {
        var t = ART.tiles[k], box = document.createElement('div'); box.className = 'cell';
        var fr = document.createElement('div'); fr.style.display = 'flex'; fr.style.gap = '3px';
        t.frames.forEach(function (F) { var cv = scaled(F, t.w, t.h, 3, '#3a3f5c'); fr.appendChild(cv); });
        var lb = document.createElement('span'); lb.textContent = k + (t.frames.length > 1 ? ' ×' + t.frames.length : '');
        box.appendChild(fr); box.appendChild(lb); sec3.appendChild(box);
      });
    }
    if (show('icons')) {
      var sec4 = section('머리 위 아이콘 (12×12)');
      Object.keys(ART.icons).forEach(function (k) {
        var t = ART.icons[k], box = document.createElement('div'); box.className = 'cell';
        box.appendChild(scaled(t.frames[0], 12, 12, 6, '#1f2a52'));
        var lb = document.createElement('span'); lb.textContent = k; box.appendChild(lb); sec4.appendChild(box);
      });
    }
    document.body.setAttribute('data-ready', '1');
  } catch (e) { errBox.textContent = '그리기 오류: ' + e.message; document.body.setAttribute('data-ready', 'err'); }
})();
</script>
</body>
</html>
