<title>할머니 사주 개발 현황판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 레이아웃: 결재함이 맨 위 → 단계 진행 띠 → 상태별 카드 묶음 → 맨 아래 완료 영역(이력 보존) */
:root {
  --bg: #f3f4f8; --surface: #ffffff; --ink: #1a2030; --muted: #5a6377; --line: #dde1ea;
  --accent: #2f3f86; --gold: #8f6b17;
  --warn: #a3520c; --warn-bg: #fbefe2; --bad: #b3261e; --bad-bg: #fbe7e5;
  --ok: #2a7347; --ok-bg: #e3f2e8; --info: #2b64a3; --info-bg: #e5eef9; --idle: #6b7385; --idle-bg: #eceef3;
  --f-display: "Noto Serif KR", "Nanum Myeongjo", serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1220; --surface: #151c2e; --ink: #e7e9f1; --muted: #9aa3b8; --line: #27314b;
  --accent: #9aabf4; --gold: #d4a847;
  --warn: #f0a35e; --warn-bg: #3a2614; --bad: #f2877f; --bad-bg: #3a1a19;
  --ok: #72cc97; --ok-bg: #15301f; --info: #84b4ec; --info-bg: #162a43; --idle: #a2a9ba; --idle-bg: #202839;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1220; --surface: #151c2e; --ink: #e7e9f1; --muted: #9aa3b8; --line: #27314b;
  --accent: #9aabf4; --gold: #d4a847;
  --warn: #f0a35e; --warn-bg: #3a2614; --bad: #f2877f; --bad-bg: #3a1a19;
  --ok: #72cc97; --ok-bg: #15301f; --info: #84b4ec; --info-bg: #162a43; --idle: #a2a9ba; --idle-bg: #202839;
  color-scheme: dark; }
*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 28px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--f-display); font-size: clamp(1.5rem, 4vw, 2rem); font-weight: 700; letter-spacing: -0.01em; }
.eyebrow { font-size: 12px; letter-spacing: 0.12em; color: var(--gold); font-weight: 600; }
.sub { color: var(--muted); margin: 6px 0 0; }
header.top { display: grid; gap: 6px; }

/* 상태 분포 막대 */
.dist { display: grid; gap: 10px; }
.bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
.bar span { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.legend b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* 단계 진행 띠 */
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 6px; }
.ph { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; display: grid; gap: 4px; font-size: 13px; min-width: 0; }
.ph .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.ph .name { font-weight: 600; line-height: 1.3; }
.ph .mini { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.ph .mini i { display: block; height: 100%; background: var(--accent); }
.ph.current { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.ph.urgent .mini i { background: var(--bad); }

/* 필터 */
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; font-size: 14px; }
.filters label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
select:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count-note { color: var(--muted); font-size: 13px; }

/* 상태 묶음 */
section.lane { display: grid; gap: 12px; }
.lane-head { display: flex; align-items: baseline; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.lane-head h2 { font-family: var(--f-display); font-size: 1.15rem; font-weight: 700; }
.lane-head .c { font-family: var(--f-mono); color: var(--muted); font-size: 13px; }
.lane-head .hint { color: var(--muted); font-size: 13px; margin-left: auto; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.empty { color: var(--muted); font-size: 14px; }

/* 카드 */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 14px 12px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; }
.id { font-family: var(--f-mono); color: var(--muted); }
.chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--muted); }
.pill { border-radius: 999px; padding: 2px 9px; font-weight: 600; margin-left: auto; }
.card h3 { font-size: 15.5px; font-weight: 600; line-height: 1.4; }
.owner { font-size: 13px; color: var(--muted); }
.owner b { color: var(--ink); font-weight: 500; }
.prog { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prog .track { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--accent); }
.stamp { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; background: var(--warn-bg); color: var(--ink); border-radius: 8px; padding: 7px 9px; }
.stamp .seal { flex: none; font-family: var(--f-display); font-weight: 700; font-size: 12px; color: var(--warn); border: 1.5px solid var(--warn); border-radius: 4px; padding: 0 5px; line-height: 1.6; transform: rotate(-4deg); }
.verify { font-size: 12.5px; color: var(--muted); }
.verify b { font-weight: 600; }
details { border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 13px; color: var(--accent); font-weight: 500; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "＋ "; }
details[open] summary::before { content: "－ "; }
dl { display: grid; grid-template-columns: 6.5em 1fr; gap: 6px 10px; margin: 10px 0 0; font-size: 13px; }
dt { color: var(--muted); }
dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
dd ul { margin: 0; padding-left: 1.1em; }
dd li.done { color: var(--muted); }
dd li.done::marker { content: "✓ "; color: var(--ok); }
dd li.todo::marker { content: "○ "; color: var(--muted); }
code { font-family: var(--f-mono); font-size: 12px; background: var(--idle-bg); padding: 0 4px; border-radius: 3px; }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 440px) { dl { grid-template-columns: 1fr; } dt { margin-top: 4px; } }
@media (prefers-reduced-motion: no-preference) { .prog .track i, .ph .mini i { transition: width .4s ease; } }
</style>

<div class="wrap">
  <header class="top">
    <span class="eyebrow">할머니가 풀어 주는 사주 · AI 개발회사</span>
    <h1>개발 현황판</h1>
    <p class="sub" id="sub"></p>
  </header>

  <div class="dist" aria-label="상태별 작업 분포">
    <div class="bar" id="bar"></div>
    <div class="legend" id="legend"></div>
  </div>

  <nav class="phases" id="phases" aria-label="개발 단계"></nav>

  <div class="filters">
    <label for="f-phase">단계 <select id="f-phase"></select></label>
    <label for="f-owner">담당 <select id="f-owner"></select></label>
    <label for="f-approval"><input type="checkbox" id="f-approval"> 결재 필요만</label>
    <span class="count-note" id="shown"></span>
  </div>

  <main id="lanes" style="display:grid;gap:30px"></main>

  <footer>
    원본 데이터는 저장소의 <code>docs/board/tasks.json</code>입니다. 진행률은 완료된 세부 작업 수로 자동 계산되며, '개발 완료'는 검증을 통과한 작업만 표시됩니다. 완료된 작업도 이력은 지우지 않습니다.
  </footer>
</div>

<script>
const BOARD = /*__BOARD_DATA__*/null;
const ORDER = ["대표 승인 대기", "수정 필요", "개발 중", "검증 중", "기획 중", "개발 대기", "보류", "개발 완료"];
const STYLE = {
  "대표 승인 대기": ["--warn", "--warn-bg", "대표님 결재가 필요한 작업"],
  "수정 필요": ["--bad", "--bad-bg", "검증에서 걸린 작업"],
  "개발 중": ["--info", "--info-bg", ""],
  "검증 중": ["--accent", "--info-bg", "품질검증 담당자 확인 중"],
  "기획 중": ["--gold", "--idle-bg", ""],
  "개발 대기": ["--idle", "--idle-bg", "선행 작업이 끝나면 시작"],
  "보류": ["--idle", "--idle-bg", ""],
  "개발 완료": ["--ok", "--ok-bg", "완료 영역 · 이력 보존"],
};
const VCOL = { "통과": "--ok", "조건부 통과": "--warn", "불합격": "--bad", "미검증": "--muted" };
const $ = s => document.querySelector(s);
const PLABEL = k => k === "U" ? "긴급" : k === "O" ? "관리" : k + "단계";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const v = name => `var(${name})`;

function store(k, val) { try { if (val === undefined) return localStorage.getItem(k); localStorage.setItem(k, val); } catch (e) { return null; } }

function render() {
  if (!BOARD) { $("#lanes").innerHTML = '<p class="empty">현황판 데이터가 없습니다. <code>node scripts/board/build.mjs</code>로 생성하세요.</p>'; return; }
  const { meta, tasks } = BOARD;
  $("#sub").textContent = `기준일 ${meta.updated} · 현재 ${meta.currentPhase}단계 「${meta.phases[meta.currentPhase]}」 · 작업 ${tasks.length}건`;

  // 분포 막대
  const counts = Object.fromEntries(ORDER.map(s => [s, tasks.filter(t => t.status === s).length]));
  $("#bar").innerHTML = ORDER.filter(s => counts[s]).map(s =>
    `<span title="${s} ${counts[s]}건" style="width:${(counts[s] / tasks.length) * 100}%;background:${v(STYLE[s][0])}"></span>`).join("");
  $("#legend").innerHTML = ORDER.filter(s => counts[s]).map(s =>
    `<span><i class="dot" style="background:${v(STYLE[s][0])}"></i>${s} <b>${counts[s]}</b></span>`).join("");

  // 단계 띠
  const phaseKeys = Object.keys(meta.phases);
  $("#phases").innerHTML = phaseKeys.map(k => {
    const list = tasks.filter(t => t.phase === k);
    const done = list.reduce((a, t) => a + t.progress.done, 0), total = list.reduce((a, t) => a + t.progress.total, 0);
    const pct = total ? Math.round((done / total) * 100) : 0;
    const cls = ["ph", String(meta.currentPhase) === k ? "current" : "", k === "U" ? "urgent" : ""].join(" ");
    return `<div class="${cls}"><span class="n">${PLABEL(k)} · ${list.length}건</span><span class="name">${esc(meta.phases[k])}</span><span class="mini" aria-label="세부 작업 ${done}/${total}"><i style="width:${pct}%"></i></span></div>`;
  }).join("");

  // 필터 옵션
  const fp = $("#f-phase"), fo = $("#f-owner"), fa = $("#f-approval");
  if (!fp.options.length) {
    fp.innerHTML = `<option value="">전체</option>` + phaseKeys.map(k => `<option value="${k}">${k === "U" || k === "O" ? esc(meta.phases[k]) : k + "단계 " + esc(meta.phases[k])}</option>`).join("");
    const owners = [...new Set(tasks.map(t => t.owner))];
    fo.innerHTML = `<option value="">전체</option>` + owners.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
    fp.value = store("board.phase") || ""; fo.value = store("board.owner") || ""; fa.checked = store("board.approval") === "1";
    if (![...fp.options].some(o => o.value === fp.value)) fp.value = "";
    if (![...fo.options].some(o => o.value === fo.value)) fo.value = "";
  }
  const shown = tasks.filter(t => (!fp.value || t.phase === fp.value) && (!fo.value || t.owner === fo.value) && (!fa.checked || t.approval.needed));
  $("#shown").textContent = shown.length === tasks.length ? "" : `${shown.length}건 표시 중`;

  $("#lanes").innerHTML = ORDER.map(s => {
    const list = shown.filter(t => t.status === s);
    if (!list.length) return "";
    return `<section class="lane" aria-labelledby="lane-${ORDER.indexOf(s)}"><div class="lane-head"><h2 id="lane-${ORDER.indexOf(s)}">${s}</h2><span class="c">${list.length}</span><span class="hint">${STYLE[s][2]}</span></div><div class="grid">${list.map(card).join("")}</div></section>`;
  }).join("") || '<p class="empty">조건에 맞는 작업이 없습니다. 필터를 바꿔 보세요.</p>';
}

function card(t) {
  const [fg, bg] = STYLE[t.status];
  const phaseLabel = PLABEL(t.phase);
  const li = t.subtasks.map(s => `<li class="${s.done ? "done" : "todo"}">${esc(s.t)}</li>`).join("");
  const list = a => a.length ? a.map(x => `<code>${esc(x)}</code>`).join(" ") : "-";
  return `<article class="card">
    <div class="meta"><span class="id">${esc(t.id)}</span><span class="chip">${phaseLabel}</span><span class="pill" style="color:${v(fg)};background:${v(bg)}">${esc(t.status)}</span></div>
    <h3>${esc(t.title)}</h3>
    <div class="owner">담당 <b>${esc(t.owner)}</b>${t.depends.length ? ` · 선행 ${t.depends.map(esc).join(", ")}` : ""}</div>
    <div class="prog"><span class="track"><i style="width:${t.progress.pct}%"></i></span><span>세부 작업 ${t.progress.done}/${t.progress.total}</span></div>
    ${t.approval.needed ? `<div class="stamp"><span class="seal">결재</span><span>${esc(t.approval.item)}</span></div>` : ""}
    <div class="verify">검증 <b style="color:${v(VCOL[t.verification.result] || "--muted")}">${esc(t.verification.result)}</b>${t.verification.note ? " · " + esc(t.verification.note) : ""}</div>
    <details><summary>상세 보기</summary><dl>
      <dt>업무 목적</dt><dd>${esc(t.purpose)}</dd>
      <dt>선행 작업</dt><dd>${t.depends.length ? t.depends.map(esc).join(", ") : "없음"}</dd>
      <dt>세부 작업</dt><dd><ul>${li}</ul></dd>
      <dt>개발 결과</dt><dd>${esc(t.result) || "-"}</dd>
      <dt>발생한 문제</dt><dd>${esc(t.issues) || "-"}</dd>
      <dt>유지관리 문서</dt><dd>${list(t.docs)}</dd>
      <dt>소스 위치</dt><dd>${list(t.code)}</dd>
      <dt>이력</dt><dd>${t.history.map(h => `${esc(h.date)} ${esc(h.status)} — ${esc(h.note)}`).join("<br>")}</dd>
    </dl></details>
  </article>`;
}

["#f-phase", "#f-owner", "#f-approval"].forEach(id => document.addEventListener("change", e => {
  if (!e.target.matches(id)) return;
  store("board.phase", $("#f-phase").value); store("board.owner", $("#f-owner").value); store("board.approval", $("#f-approval").checked ? "1" : "0");
  render();
}));
render();
</script>
