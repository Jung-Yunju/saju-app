# ── 칸(cell) 형식 ──────────────────────────────────────────
# 120칸 각각을 아래 형식으로 채운다. 확인 전에는 칸을 만들지 않는다(빈 칸 = 미확인).
cell_schema:
  id: "johu.{dayStem}.{monthBranch}"   # 예: johu.甲.寅
  day_stem: Stem
  month_branch: Branch
  sub_period: null                     # 원문이 같은 달을 절기 앞뒤로 나눠 말한 경우만 (예: 中氣 전/후). 없으면 null
  primary: []                          # 주로 쓰는 천간 (원문 순서 유지)
  auxiliary: []                        # 보조 천간
  conditions: []                       # 원문이 붙인 조건(투출·통근·특정 글자 유무 등)을 요지로
  avoid: []                            # 꺼린다고 한 글자
  classical:
    summary: null                      # 칸 요지
    removed_in_modern: []              # 귀천·빈부·수명 등 판정 원문 요지
    original_text: null                # L2 확인 시에만, 짧은 구절
    citation: null                     # 판본·권·장(일간)·쪽 또는 URL
    source_status: unverified
  modern:
    interpretation: null
  edition_diffs: []                    # 원본(난강망 계열)·여춘대본·서락오 평주본(造化元鑰) 사이 글자 차이
  reviewed_by: []

# ── 엔진 사용 규칙 (P3-06 입력) ────────────────────────────
engine_usage:
  lookup: "dayStem + pillars.month.branch 로 칸 조회. 칸이 없으면 조후 후보를 내지 않고 basis에 'johu table cell unverified'를 남긴다."
  output: "usefulGodCandidates 에 { element, method: '조후', school: '궁통보감', basis: [cell id, 조건 충족 여부] } 추가"
  forbidden: "칸이 비어 있을 때 LLM이나 추정으로 채우지 않는다."

cells: []   # 아직 L2 확인된 칸 없음
