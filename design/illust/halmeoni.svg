<?xml version="1.0" encoding="UTF-8"?>
<!-- 할머니 상반신(시안). 색은 --ill-* 토큰(design/tokens.css)을 따르고, 파일만 열면 기본값으로 보인다. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="사주를 풀어 주는 할머니">
  <!-- 쪽머리와 비녀 -->
  <circle cx="60" cy="25" r="12.5" style="fill:var(--ill-hair,#dad5cf)"/>
  <path d="M33 22.5 L88 22.5" style="stroke:var(--ill-frame,#8f6a22)" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="90" cy="22.5" r="4.2" style="fill:var(--ill-goreum,#d4a847);stroke:var(--ill-line,#3b2d25)" stroke-width="1.2"/>
  <!-- 저고리 -->
  <path d="M16 120 C18 95 37 83 60 83 C83 83 102 95 104 120 Z" style="fill:var(--ill-hanbok,#2b3a6e)"/>
  <path d="M52.5 71 L52.5 85 Q60 89.5 67.5 85 L67.5 71 Z" style="fill:var(--ill-skin,#eccaa9)"/>
  <path d="M43 84 L60 107 L77 84" fill="none" style="stroke:var(--ill-collar,#fffaf0)" stroke-width="6.5" stroke-linejoin="round"/>
  <g style="fill:var(--ill-goreum,#d4a847)">
    <path d="M66 104 C61 99 56 101 57.5 105 C59 108.5 63.5 107 66 104 Z"/>
    <path d="M66 104 C71 99 76 101 74.5 105 C73 108.5 68.5 107 66 104 Z"/>
    <path d="M64.6 104.5 C64 110 62.5 115 60.5 120 L64.5 120 C66 115 66.6 110 66.8 104.8 Z"/>
    <path d="M66.4 104.6 C68.5 109 71.5 113 75.5 117 L78 114.6 C74.5 111.6 70.8 108.2 67.8 104.2 Z"/>
    <circle cx="66" cy="104.2" r="2.3"/>
  </g>
  <!-- 얼굴 -->
  <ellipse cx="36.8" cy="58" rx="4.2" ry="6.2" style="fill:var(--ill-skin,#eccaa9)"/>
  <ellipse cx="83.2" cy="58" rx="4.2" ry="6.2" style="fill:var(--ill-skin,#eccaa9)"/>
  <ellipse cx="60" cy="55" rx="23.5" ry="25.5" style="fill:var(--ill-skin,#eccaa9)"/>
  <path d="M36.3 53 C34 34 45 27 60 27 C75 27 86 34 83.7 53 C80 42.5 70 38 60 39.2 C50 38 40 42.5 36.3 53 Z" style="fill:var(--ill-hair,#dad5cf)"/>
  <path d="M60 28.5 Q58.6 34 60 39" fill="none" style="stroke:var(--ill-hair-shade,#aaa39b)" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M42 45 Q48 40.5 55 40.6 M78 45 Q72 40.5 65 40.6" fill="none" style="stroke:var(--ill-hair-shade,#aaa39b)" stroke-width="1.1" stroke-linecap="round"/>
  <!-- 동그란 안경, 웃는 눈 -->
  <g fill="none" style="stroke:var(--ill-frame,#8f6a22)" stroke-width="1.6">
    <circle cx="50.5" cy="57" r="7.2"/><circle cx="69.5" cy="57" r="7.2"/><path d="M57.7 56.5 Q60 54.6 62.3 56.5"/>
  </g>
  <g fill="none" style="stroke:var(--ill-line,#3b2d25)" stroke-width="1.9" stroke-linecap="round">
    <path d="M47 58.4 Q50.5 54.6 54 58.4"/><path d="M66 58.4 Q69.5 54.6 73 58.4"/>
    <path d="M54 70 Q60 75.5 66 70"/>
  </g>
  <g style="fill:var(--ill-blush,#e3a08a)" opacity=".55"><ellipse cx="44" cy="67" rx="4.6" ry="2.7"/><ellipse cx="76" cy="67" rx="4.6" ry="2.7"/></g>
</svg>
