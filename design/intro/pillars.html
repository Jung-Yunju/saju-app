<!doctype html>
<html lang="ko" class="is-play">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인트로 ③ 여덟 글자가 내려앉는다 — 할머니가 풀어 주는 사주 (시안)</title>
<meta name="theme-color" content="#f3eadb">
<script>
/* 그리기 전에 결정(design/intro 공통):
   - 움직임 줄이기 설정 또는 ?still=1 → 끝 장면 정지(is-still)
   - 재방문(localStorage 'halmi-intro-seen') → 인트로 생략, 끝 장면(is-revisit). ?fresh=1 이면 무시
   - 기본은 압축본(cut-short, 2~3초). ?cut=full 이면 전체판 */
(function(){var q=location.search,c='is-play';
if(/[?&]still=1/.test(q)||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))c='is-done is-still';
else{try{if(!/[?&](fresh=1|at=)/.test(q)&&localStorage.getItem('halmi-intro-seen'))c='is-done is-revisit';}catch(e){}}
if(!/[?&]cut=full/.test(q))c+=' cut-short';document.documentElement.className=c;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 한자는 이 화면에 쓰는 글자만 잘라 받는다(text=) -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&text=%E5%A3%AC%E7%94%B3%E6%88%8A%E6%88%8C%E7%94%B2%E8%BE%B0&display=swap">
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* ── 토큰: design/tokens.css 시안 B 밝은 테마 값 ── */
:root{
  --bg:#f3eadb; --bg-deep:#e9dcc6; --text:#221e1b; --muted:#5f564d; --gold:#7a5233;
  --accent:#221e1b; --on-accent:#fff7e6; --hl:#f2c14e; --surface:#fffaf2;
  --el-wood:#41693b; --el-wood-soft:#e8e9dc; --el-fire:#9e4a2b; --el-fire-soft:#f3e5da;
  --el-earth:#7d5e1c; --el-earth-soft:#efe7d8; --el-metal:#5e6269; --el-metal-soft:#ece8e2;
  --el-water:#2e4a6b; --el-water-soft:#e6e5e2;
  --f-hanja:"Noto Serif KR","Songti SC","SimSun",serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.intro{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  background:radial-gradient(120% 60% at 50% 0%,#e6d7bd 0,rgba(230,215,189,0) 70%),var(--bg)}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 12px 0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.ctl{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;color:var(--text);background:var(--surface);border:1.5px solid var(--text);cursor:pointer}
.ctl:focus-visible,.btn:focus-visible{outline:3px solid var(--hl);outline-offset:2px;box-shadow:0 0 0 5px var(--text)}
.is-still .ctl{display:none}
.main{position:relative;flex:1 1 auto;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:28px 20px 44px}
.copy{position:relative;z-index:5;width:100%;max-width:440px;margin:0 auto;padding:4px 20px max(20px,env(safe-area-inset-bottom))}
.line{margin:0 0 18px;font-size:22px;line-height:1.48;font-weight:700;letter-spacing:-.02em;word-break:keep-all;text-wrap:balance}
.who{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none;box-shadow:0 4px 0 rgba(122,82,51,.55);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(122,82,51,.55)}
.foot{margin:14px 0 0;font-size:12px;line-height:1.55;color:var(--muted);word-break:keep-all}

/* 원국 종이 */
.sheet{position:relative;width:100%;max-width:350px;padding:16px 14px 18px;background:var(--surface);border:1.5px solid var(--text);border-radius:24px;box-shadow:0 4px 0 rgba(34,30,27,.9)}
.sheet__head{display:flex;align-items:center;gap:8px;margin:0 2px 12px;font-size:13px;color:var(--muted);line-height:1.35}
.ex{flex:none;padding:3px 10px;border:1.5px dashed var(--gold);border-radius:999px;color:var(--gold);font-weight:700;font-size:13px}
.cols{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cols .h{text-align:center;font-size:13px;font-weight:700;color:var(--muted);padding-bottom:2px}
.cols .h small{display:block;font-weight:400;font-size:12px;margin-top:1px}
.cell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;aspect-ratio:1/1.08;border:1.5px solid var(--text);border-radius:14px;background:var(--soft)}
.cell[data-el=wood]{--soft:var(--el-wood-soft);--c:var(--el-wood)}
.cell[data-el=earth]{--soft:var(--el-earth-soft);--c:var(--el-earth)}
.cell[data-el=metal]{--soft:var(--el-metal-soft);--c:var(--el-metal)}
.cell[data-el=water]{--soft:var(--el-water-soft);--c:var(--el-water)}
.cell.me{border-width:2.5px}
.cell.me::before{content:"나";position:absolute;top:-10px;left:50%;transform:translateX(-50%);padding:0 7px;border-radius:999px;background:var(--text);color:var(--surface);font-size:12px;font-weight:700;line-height:17px}
.cell.me .ch{margin-top:8px}
.ch{display:block;font-family:var(--f-hanja);font-weight:700;font-size:36px;line-height:1;color:var(--text)}
.cap{margin-top:6px;font-size:13px;font-weight:700;color:var(--c);letter-spacing:.02em}
.cell::after{content:"";position:absolute;inset:-2px;border-radius:16px;border:2px solid var(--text);opacity:0;pointer-events:none}
/* 복자 발 도장 */
.paw{position:absolute;right:12px;top:10px;width:30px;height:30px;transform:rotate(14deg)}
/* 찻잔을 든 할머니 손 */
.tea{position:absolute;right:-26px;bottom:-62px;width:190px;height:auto;overflow:visible;pointer-events:none}
@media (min-width:960px){
  .main{flex-direction:row-reverse;align-items:center;max-width:1180px;width:100%;margin:0 auto;padding:0 40px 40px;gap:64px} /* 손이 화면 오른쪽 끝에서 들어오도록 장면을 오른쪽에 */
  .scene{flex:1.2 1 0;padding:40px 40px 80px}
  .sheet{max-width:520px;padding:24px 22px 26px}
  .cols{gap:12px}
  .ch{font-size:56px}
  .cap{font-size:15px}
  .cols .h{font-size:15px}
  .tea{width:260px;right:-60px;bottom:-84px}
  .copy{flex:0 0 400px;padding:0}
  .line{font-size:28px}
}

/* ── 움직임(.is-play). 기본 상태 = 끝 장면 ── */
svg .fb{transform-box:fill-box}
.is-play .copy .line{animation:rise .6s .8s var(--ease) both}
.is-play .copy .foot{animation:fadeIn .6s 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0}}
/* 글자: 먹물 별처럼 하늘에서 떨어져 칸에 앉는다(태어난 순서: 연→월→일→시) */
.is-play .ch{animation:fall 1s var(--d) both}
.is-play .cap{animation:fadeIn .4s calc(var(--d) + .8s) both}
.is-play .cell::after{animation:ring .7s calc(var(--d) + .78s) ease-out both}
@keyframes fall{
  0%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.3);filter:blur(3px);color:#3b2d25;text-shadow:0 0 10px #f2c14e,0 0 2px #f2c14e;animation-timing-function:cubic-bezier(.5,0,.85,.45)}
  10%{opacity:1}
  78%{transform:translate(0,3px) scale(1.14);filter:blur(0);text-shadow:0 0 6px rgba(242,193,78,.6);animation-timing-function:ease-out}
  100%{opacity:1;transform:none;filter:none;text-shadow:none}}
@keyframes ring{0%{opacity:.55;transform:scale(.7)}100%{opacity:0;transform:scale(1.18)}}
/* 반짝이는 점(별)이 먼저 떠 있다가 사라진다 */
.sky{position:absolute;inset:0;pointer-events:none}
.sky i{position:absolute;width:6px;height:6px;border-radius:50%;background:#f2c14e;box-shadow:0 0 8px 2px rgba(242,193,78,.7);opacity:0}
.is-play .sky i{animation:twinkle 1.2s var(--d) ease-in-out both}
@keyframes twinkle{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:translateY(40px) scale(.3)}}
/* 찻잔: 손이 들고 와 내려놓고 손만 물러난다 */
.is-play #cup{animation:cupIn 1.1s 2.9s both}
@keyframes cupIn{0%{opacity:0;transform:translate(150px,-46px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}18%{opacity:1}72%{transform:translate(0,-9px);animation-timing-function:ease-in}100%{transform:none}}
.is-play #hand{animation:handIn 1.1s 2.9s both,handOut .7s 4.15s cubic-bezier(.5,0,.75,0) forwards}
#hand{opacity:0;transform:translate(170px,30px)}
@keyframes handIn{0%{opacity:0;transform:translate(150px,-46px);animation-timing-function:cubic-bezier(.2,.7,.3,1)}18%{opacity:1}72%{opacity:1;transform:translate(0,-9px);animation-timing-function:ease-in}100%{opacity:1;transform:none}}
@keyframes handOut{0%{opacity:1;transform:none}60%{opacity:1}100%{opacity:0;transform:translate(220px,40px)}}
.is-play #ripple{animation:ripple .9s 3.95s ease-out forwards}
#ripple{opacity:0}
@keyframes ripple{0%{opacity:.8;transform:scale(.6)}100%{opacity:0;transform:scale(1.2)}}
.steam path{stroke-dasharray:40;stroke-dashoffset:0}
.is-play .steam path{animation:steam 1.8s 4.3s ease-out 2 both}
.is-play .steam path+path{animation-delay:4.6s}
@keyframes steam{0%{stroke-dashoffset:40;opacity:0;transform:translateY(4px)}40%{opacity:1}100%{stroke-dashoffset:0;opacity:1;transform:none}}
.is-play .paw{animation:stamp .5s 4.9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{0%{opacity:0;transform:rotate(14deg) scale(1.8)}100%{opacity:1;transform:rotate(14deg)}}
/* 종이 뒤에서 빼꼼 올라오는 복자 */
.peek{position:absolute;left:56%;top:-44px;width:64px;height:auto;z-index:-1}
.peek-paws{position:absolute;left:calc(56% + 9px);top:-7px;width:46px;height:auto}
@media (min-width:960px){.peek{width:84px;top:-58px}.peek-paws{width:60px;left:calc(56% + 12px);top:-9px}}
.is-play .peek{animation:peekUp .7s 4.2s cubic-bezier(.3,1.4,.5,1) both}
.is-play .peek-paws{animation:fadeIn .25s 4.45s both}
@keyframes peekUp{0%{opacity:0;transform:translateY(90px)}25%{opacity:1}100%{opacity:1;transform:none}}
#pk-eyes{transform-origin:50% 50%}
.is-play #pk-eyes{animation:slowBlink 1s 5.0s ease-in-out both}
@keyframes slowBlink{0%,100%{transform:none}35%,55%{transform:scaleY(.12)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="intro">
  <header class="top">
    <span class="brand">
      <svg viewBox="0 0 128 128" aria-hidden="true"><circle cx="64" cy="64" r="62" fill="#f3eadb" stroke="#221e1b" stroke-width="3"/><path d="M60 46 L112 22" stroke="#7a5233" stroke-width="4.5" stroke-linecap="round"/><circle cx="111" cy="22.5" r="6" fill="#f2c14e" stroke="#221e1b" stroke-width="2.2"/><g fill="#221e1b" stroke="#221e1b" stroke-width="5" stroke-linejoin="round"><path d="M30 56 L33 20 L58 38 Z"/><path d="M98 56 L95 20 L70 38 Z"/></g><ellipse cx="64" cy="72" rx="39" ry="33" fill="#221e1b"/><path d="M64 45 C62 53 56.5 61 53.5 71 C50.5 82 55 94.5 64 94.5 C73 94.5 77.5 82 74.5 71 C71.5 61 66 53 64 45 Z" fill="#fffaf2"/><g fill="#f2c14e"><ellipse cx="44.5" cy="68" rx="7" ry="7.6"/><ellipse cx="83.5" cy="68" rx="7" ry="7.6"/></g><g fill="#221e1b"><ellipse cx="44.5" cy="68.5" rx="2.2" ry="5.6"/><ellipse cx="83.5" cy="68.5" rx="2.2" ry="5.6"/></g><path d="M60 76.5 L68 76.5 L64 81 Z" fill="#c4877c"/></svg>
      할머니가 풀어 주는 사주
    </span>
    <button class="ctl" id="ctl" type="button">건너뛰기</button>
  </header>

  <div class="main">
    <div class="scene">
      <div class="sky" aria-hidden="true">
        <i style="left:18%;top:4%;--d:.05s"></i><i style="left:34%;top:9%;--d:.2s"></i><i style="left:52%;top:2%;--d:.1s"></i><i style="left:70%;top:7%;--d:.25s"></i>
        <i style="left:84%;top:3%;--d:.15s"></i><i style="left:26%;top:15%;--d:.3s"></i><i style="left:61%;top:13%;--d:.35s"></i><i style="left:44%;top:18%;--d:.4s"></i>
      </div>
      <figure class="sheet" style="margin:0" aria-label="예시 사주 원국표. 시주 갑진, 일주 임술, 월주 무신, 연주 임신. 종이 위로 고양이 복자가 고개를 내밀고, 할머니 손이 찻잔을 내려놓는다">
        <svg class="peek" viewBox="0 0 80 64" aria-hidden="true">
          <g fill="#1d1a18"><path d="M12 34 L14 4 L34 20 Z"/><path d="M68 34 L66 4 L46 20 Z"/><ellipse cx="40" cy="42" rx="30" ry="26"/></g>
          <path d="M17 26 L18 12 L28 20 Z M63 26 L62 12 L52 20 Z" fill="#c9897b"/>
          <path d="M40 19 C38 27 32 33 31 42 C30 52 34 60 40 60 C46 60 50 52 49 42 C48 33 42 27 40 19 Z" fill="#fffaf2"/>
          <g id="pk-eyes" class="fb"><ellipse cx="27" cy="40" rx="5.4" ry="6" fill="#f2c14e"/><ellipse cx="53" cy="40" rx="5.4" ry="6" fill="#f2c14e"/><ellipse cx="27.6" cy="41" rx="1.8" ry="4.6" fill="#1d1a18"/><ellipse cx="53.6" cy="41" rx="1.8" ry="4.6" fill="#1d1a18"/><circle cx="29" cy="38.4" r="1.3" fill="#fffaf2"/><circle cx="55" cy="38.4" r="1.3" fill="#fffaf2"/></g>
        </svg>
        <svg class="peek-paws" viewBox="0 0 46 14" aria-hidden="true"><g fill="#fffaf2" stroke="#1d1a18" stroke-width="1.6"><ellipse cx="9" cy="7" rx="7.5" ry="5.5"/><ellipse cx="37" cy="7" rx="7.5" ry="5.5"/></g><g stroke="#1d1a18" stroke-width="1.1" stroke-linecap="round"><path d="M6.5 9.5 V6 M11.5 9.5 V6 M34.5 9.5 V6 M39.5 9.5 V6"/></g></svg>
        <div class="sheet__head"><span class="ex">예시</span><span>1992년 8월 14일 오전 9시생<br>서울 · 양력</span></div>
        <div class="cols">
          <div class="h">시주<small>태어난 시</small></div><div class="h">일주<small>태어난 날</small></div><div class="h">월주<small>태어난 달</small></div><div class="h">연주<small>태어난 해</small></div>
          <!-- 천간: 시 甲 · 일 壬 · 월 戊 · 연 壬 -->
          <div class="cell" data-el="wood" style="--d:2.1s"><span class="ch" style="--dx:70px;--dy:-260px;--rot:-24deg">甲</span><span class="cap">갑 · 목</span></div>
          <div class="cell me" data-el="water" style="--d:1.5s"><span class="ch" style="--dx:-30px;--dy:-300px;--rot:18deg">壬</span><span class="cap">임 · 수</span></div>
          <div class="cell" data-el="earth" style="--d:.9s"><span class="ch" style="--dx:40px;--dy:-280px;--rot:-14deg">戊</span><span class="cap">무 · 토</span></div>
          <div class="cell" data-el="water" style="--d:.3s"><span class="ch" style="--dx:-60px;--dy:-250px;--rot:22deg">壬</span><span class="cap">임 · 수</span></div>
          <!-- 지지: 시 辰 · 일 戌 · 월 申 · 연 申 -->
          <div class="cell" data-el="earth" style="--d:2.4s"><span class="ch" style="--dx:30px;--dy:-370px;--rot:16deg">辰</span><span class="cap">진 · 토</span></div>
          <div class="cell" data-el="earth" style="--d:1.8s"><span class="ch" style="--dx:60px;--dy:-390px;--rot:-20deg">戌</span><span class="cap">술 · 토</span></div>
          <div class="cell" data-el="metal" style="--d:1.2s"><span class="ch" style="--dx:-50px;--dy:-360px;--rot:12deg">申</span><span class="cap">신 · 금</span></div>
          <div class="cell" data-el="metal" style="--d:.6s"><span class="ch" style="--dx:-20px;--dy:-380px;--rot:-18deg">申</span><span class="cap">신 · 금</span></div>
        </div>
        <svg class="paw" viewBox="0 0 40 40" aria-hidden="true"><g fill="#221e1b" opacity=".85"><ellipse cx="20" cy="26" rx="9" ry="7.5"/><ellipse cx="9" cy="15" rx="3.6" ry="4.6"/><ellipse cx="16" cy="9" rx="3.6" ry="4.8"/><ellipse cx="24" cy="9" rx="3.6" ry="4.8"/><ellipse cx="31" cy="15" rx="3.6" ry="4.6"/></g></svg>
        <!-- 찻잔과 할머니 손 -->
        <svg class="tea" viewBox="0 0 200 140" aria-hidden="true">
          <ellipse id="ripple" class="fb" cx="86" cy="118" rx="46" ry="9" fill="none" stroke="#7a5233" stroke-width="2"/>
          <g id="cup">
            <ellipse cx="86" cy="118" rx="38" ry="7" fill="rgba(34,30,27,.18)"/>
            <path d="M54 80 H118 C117 103 104 116 86 116 C68 116 55 103 54 80 Z" fill="#fffaf2" stroke="#221e1b" stroke-width="2.6" stroke-linejoin="round"/>
            <ellipse cx="86" cy="80" rx="32" ry="7" fill="#fffaf2" stroke="#221e1b" stroke-width="2.6"/>
            <ellipse cx="86" cy="81" rx="26.5" ry="4.6" fill="#c9a55a"/>
            <path d="M56.6 90 H115.4" stroke="#6d8a6a" stroke-width="3"/>
            <g class="steam" fill="none" stroke="#7a5233" stroke-opacity=".6" stroke-width="2.4" stroke-linecap="round"><path class="fb" d="M78 70 C73 62 83 57 78 48"/><path class="fb" d="M94 70 C89 62 99 57 94 48"/></g>
          </g>
          <g id="hand">
            <!-- 소매(저고리)와 끝동 -->
            <path d="M430 34 C300 42 190 60 140 76 L150 112 C210 112 330 128 430 146 Z" fill="#6d8a6a" stroke="#221e1b" stroke-width="2.6" stroke-linejoin="round"/>
            <path d="M140 76 L150 112 L162 110 L152 74 Z" fill="#c8693f" stroke="#221e1b" stroke-width="2.2" stroke-linejoin="round"/>
            <!-- 손: 잔 옆을 감싼 손가락과 엄지 -->
            <path d="M141 80 C130 80 120 84 113 90 C110 94 112 98 117 97 C112 101 112 106 117 106 C113 110 115 114 120 113 C124 116 132 116 140 112 L148 108 Z" fill="#eecaa6" stroke="#221e1b" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M136 80 C128 76 118 74 112 77 C109 79 110 82 113 83 C120 83 126 84 132 87" fill="#eecaa6" stroke="#221e1b" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M117 97 C122 96 127 96 131 97 M117 106 C122 105 127 105 131 106" fill="none" stroke="#3b2d25" stroke-width="1.4" stroke-linecap="round"/>
          </g>
        </svg>
      </figure>
    </div>

    <section class="copy">
      <p class="line"><span class="who">할머니</span>치수부터 재자. 네 여덟 글자, 할미가 찬찬히 풀어 주마.</p>
      <a class="btn" href="#start">생년월일 넣고 할머니한테 물어보기</a>
      <p class="foot">사주 풀이는 전통 명리 해석에 따른 이야기이며, 미래를 과학적으로 예측한다는 뜻이 아닙니다. 위 글자는 예시입니다.</p>
    </section>
  </div>
</div>
<script>
(function(){
  /* 전체판 6.1초 · 압축본 3.05초. 압축 방식: 같은 움직임을 2배속 */
  var FULL=6100, SHORT=3050, RATE=2;
  var h=document.documentElement, q=new URLSearchParams(location.search), btn=document.getElementById('ctl'), timer;
  var short=h.classList.contains('cut-short'), total=short?SHORT:FULL;
  function speed(){if(short&&RATE!==1)document.getAnimations().forEach(function(a){a.playbackRate=RATE;});}
  function mark(){try{localStorage.setItem('halmi-intro-seen','1');}catch(e){}}
  function done(){clearTimeout(timer);h.classList.remove('is-play');h.classList.add('is-done');btn.textContent='다시 보기';}
  function play(){clearTimeout(timer);h.classList.remove('is-done','is-revisit','is-play');void h.offsetWidth;h.classList.add('is-play');speed();btn.textContent='건너뛰기';timer=setTimeout(done,total);}
  btn.addEventListener('click',function(){h.classList.contains('is-play')?done():play();});
  window.replay=play; window.finish=done;
  addEventListener('message',function(e){if(e.data==='replay')play();});
  if(h.classList.contains('is-done')){btn.textContent='다시 보기';return;}
  var at=q.get('at'); /* 검수용: ?at=1500 화면 시계 1.5초 장면에서 멈춤, ?at=end 끝 장면 */
  if(at==='end'){done();return;}
  speed();
  if(at!==null){document.getAnimations().forEach(function(a){var r=a.playbackRate||1;a.pause();a.currentTime=+at*r;});return;}
  mark(); timer=setTimeout(done,total);
})();
</script>
</body>
</html>
