<!-- 글꼴은 그리기를 막지 않게 늦게 붙인다(먼저 기본 명조로 그린 뒤 바뀜) -->
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* ── 토큰: design/tokens.css 시안 B '등잔 밤'(어두운 테마) 값 ── */
:root{
  --bg:#1b1815; --text:#f3eadb; --muted:#b8ad9e; --gold:#e0b860;
  --accent:#f2c14e; --on-accent:#1b1815; --ink:#221e1b; --surface:#fffaf2;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.intro{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 12px 0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.ctl{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;color:var(--muted);background:rgba(27,24,21,.6);border:1.5px solid #5a5047;cursor:pointer}
.ctl:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.is-still .ctl{display:none}
.main{position:relative;flex:1 1 auto;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:300px}
.scene svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.copy{position:relative;z-index:5;width:100%;max-width:440px;margin:0 auto;padding:4px 20px max(20px,env(safe-area-inset-bottom))}
.line{margin:0 0 18px;font-size:22px;line-height:1.48;font-weight:700;letter-spacing:-.02em;word-break:keep-all;text-wrap:balance}
.who{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none;box-shadow:0 4px 0 rgba(0,0,0,.55);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.55)}
.foot{margin:14px 0 0;font-size:12px;line-height:1.55;color:var(--muted);word-break:keep-all}
/* 어둠: 등잔 위치(--lx,--ly)를 중심으로 걷힌다 */
@property --r{syntax:'<length>';inherits:false;initial-value:190px}
.dark{position:absolute;inset:0;z-index:3;pointer-events:none;--r:190px;
  background:radial-gradient(circle at var(--lx,80%) var(--ly,42%),rgba(20,16,13,0) 0,rgba(20,16,13,0) var(--r),rgba(20,16,13,.5) calc(var(--r)*1.9),rgba(20,16,13,.84) calc(var(--r)*3))}
.dark::after{content:"";position:absolute;inset:0;background:#120f0d;opacity:0}
@media (min-width:960px){
  .main{flex-direction:row;align-items:center;max-width:1180px;width:100%;margin:0 auto;padding:0 40px 40px;gap:48px}
  .scene{align-self:stretch;flex:1.3 1 0}
  .copy{flex:0 0 420px;padding:32px 32px 28px;background:#1b1815;border:1.5px solid #5a5047;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.45)}
  .copy::before{content:"";position:absolute;left:-13px;top:58px;width:22px;height:22px;background:#1b1815;border-left:1.5px solid #5a5047;border-bottom:1.5px solid #5a5047;transform:rotate(45deg);border-bottom-left-radius:4px}
  .line{font-size:27px}
}
/* ── 움직임: .is-play 일 때만. 정지 화면 = 각 요소의 기본 상태(끝 장면) ── */
svg .fb{transform-box:fill-box}
.is-play .dark{animation:dawn 1.9s .45s var(--ease) both}
.is-play .dark::after{animation:fadeOut 1.1s .35s ease-out both}
@keyframes dawn{from{--r:0px}}
@keyframes fadeOut{from{opacity:.94}to{opacity:0}}
.is-play #spark{animation:spark .5s .15s ease-out both}
@keyframes spark{0%{opacity:0;transform:scale(.2)}40%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(.6)}}
#flame{transform-origin:50% 100%}
.is-play #flame{animation:ignite .55s .3s cubic-bezier(.3,1.6,.5,1) both,flicker .9s .85s ease-in-out 2}
@keyframes ignite{from{transform:scale(.05,.1);opacity:0}to{transform:none;opacity:1}}
@keyframes flicker{0%,100%{transform:none}30%{transform:scale(.92,1.08) skewX(-3deg)}60%{transform:scale(1.05,.95) skewX(2deg)}}
.is-play #halo{animation:fadeIn 1s .4s ease-out both}
.is-play #wallglow{animation:fadeIn 1.6s .5s ease-out both}
@keyframes fadeIn{from{opacity:0}}
.is-play .copy .line{animation:rise .6s .9s var(--ease) both}
.is-play .copy .foot{animation:fadeIn .6s 1.2s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
/* 할머니: 고개를 살짝 들며 끄덕 */
#hm-head{transform-origin:50% 92%}
.is-play #hm-head{animation:nod 1s 2.1s ease-in-out both}
@keyframes nod{0%{transform:rotate(-4deg) translateY(2px)}45%{transform:rotate(2deg)}100%{transform:none}}
/* 복자: 졸다가 눈을 뜨고, 귀를 털고, 꼬리를 한 번 치고, 마지막에 천천히 깜빡 */
.is-play #bk-z{animation:zz 2.4s 0s ease-in-out both}
@keyframes zz{0%,70%{opacity:1;transform:none}100%{opacity:0;transform:translate(6px,-8px)}}
#bk-z{opacity:0}
#bk-closed{opacity:0}
.is-play #bk-closed{animation:hold1 2.5s both}
@keyframes hold1{0%,99%{opacity:1}100%{opacity:0}}
#bk-open{transform-origin:50% 50%}
.is-play #bk-open{animation:eyesOpen .35s 2.5s ease-out both,slowBlink 1s 4.5s ease-in-out both}
@keyframes eyesOpen{from{opacity:0;transform:scaleY(.1)}to{opacity:1;transform:none}}
@keyframes slowBlink{0%,100%{transform:none}35%,55%{transform:scaleY(.12)}}
#bk-ear{transform-origin:20% 100%}
.is-play #bk-ear{animation:ear .4s 2.8s ease-in-out both}
@keyframes ear{0%,100%{transform:none}50%{transform:rotate(-14deg)}}
#bk-tail{transform-origin:0% 100%}
.is-play #bk-tail{animation:tail .9s 3.1s ease-in-out both}
@keyframes tail{0%,100%{transform:none}40%{transform:rotate(-22deg)}70%{transform:rotate(8deg)}}
/* 찻김 */
.steam path{stroke-dasharray:40;stroke-dashoffset:0}
.is-play .steam path{animation:steam 1.8s 1.6s ease-out 2 both}
.is-play .steam path+path{animation-delay:1.9s}
@keyframes steam{0%{stroke-dashoffset:40;opacity:0;transform:translateY(4px)}40%{opacity:1}100%{stroke-dashoffset:0;opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

  var TOTAL=5600, h=document.documentElement, btn=document.getElementById('ctl'), timer;
  var dark=document.getElementById('dark'), flame=document.getElementById('flame');
  function aim(){ /* 어둠이 걷히는 중심 = 등잔불 화면 위치 */
    var r=flame.getBoundingClientRect(), b=dark.getBoundingClientRect();
    dark.style.setProperty('--lx',(r.left+r.width/2-b.left)+'px');
    dark.style.setProperty('--ly',(r.top+r.height*.6-b.top)+'px');
  }
  aim(); addEventListener('resize',aim);
  function done(){clearTimeout(timer);h.classList.remove('is-play');h.classList.add('is-done');btn.textContent='다시 보기';}
  function play(){clearTimeout(timer);h.classList.remove('is-done');h.classList.remove('is-play');void h.offsetWidth;h.classList.add('is-play');btn.textContent='건너뛰기';timer=setTimeout(done,TOTAL);}
  btn.addEventListener('click',function(){h.classList.contains('is-play')?done():play();});
  window.replay=play; window.finish=done;
  addEventListener('message',function(e){if(e.data==='replay')play();});
  if(h.classList.contains('is-done')){btn.textContent='다시 보기';return;}
  var at=new URLSearchParams(location.search).get('at'); /* 검수용: ?at=1500 그 순간에 멈춤, ?at=end 끝 장면 */
  if(at==='end'){done();return;}
  if(at!==null){document.getAnimations().forEach(function(a){a.pause();a.currentTime=+at;});return;}
  timer=setTimeout(done,TOTAL);
})();
</script>
</body>
</html>
