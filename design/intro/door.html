<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인트로 ② 복자가 문을 연다 — 할머니가 풀어 주는 사주 (시안)</title>
<meta name="theme-color" content="#f3eadb">
<script>
/* 그리기 전에 결정(design/intro 공통):
   - 움직임 줄이기 설정 또는 ?still=1 → 끝 장면 정지(is-still)
   - 재방문(localStorage 'halmi-intro-seen') → 인트로 생략, 끝 장면(is-revisit). ?fresh=1 이면 무시
   - 기본은 압축본(cut-short, 2~3초). ?cut=full 이면 전체판 */
(function(){var q=location.search,c='is-play';
if(/[?&]still=1/.test(q)||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))c='is-done is-still';
else{try{if(!/[?&](fresh=1|at=)/.test(q)&&localStorage.getItem('halmi-intro-seen'))c='is-done is-revisit';}catch(e){}}
if(!/[?&]cut=full/.test(q))c+=' cut-short';document.documentElement.className=c;})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<style>
/* ── 토큰: design/tokens.css 시안 B 밝은 테마 값 ── */
:root{
  --bg:#f3eadb; --text:#221e1b; --muted:#5f564d; --gold:#7a5233;
  --accent:#221e1b; --on-accent:#fff7e6; --hl:#f2c14e; --surface:#fffaf2;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text)}
body{font-family:"Gowun Batang","Noto Serif KR","Apple SD Gothic Neo",serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
.intro{position:relative;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;overflow:hidden;isolation:isolate}
.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 12px 0 16px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.02em}
.brand svg{width:30px;height:30px;flex:none}
.ctl{min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;font:inherit;font-size:14px;font-weight:700;color:var(--text);background:var(--surface);border:1.5px solid var(--text);cursor:pointer}
.ctl:focus-visible,.btn:focus-visible{outline:3px solid var(--hl);outline-offset:2px;box-shadow:0 0 0 5px var(--text)}
.is-still .ctl{display:none}
.main{position:relative;flex:1 1 auto;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:300px}
.scene svg{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible}
.copy{position:relative;z-index:5;width:100%;max-width:440px;margin:0 auto;padding:10px 20px max(20px,env(safe-area-inset-bottom))}
.line{margin:0 0 18px;font-size:22px;line-height:1.48;font-weight:700;letter-spacing:-.02em;word-break:keep-all;text-wrap:balance}
.who{display:block;margin-bottom:6px;font-size:14px;font-weight:700;color:var(--gold);letter-spacing:0}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:17px;letter-spacing:-.02em;text-decoration:none;box-shadow:0 4px 0 rgba(122,82,51,.55);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(122,82,51,.55)}
.foot{margin:14px 0 0;font-size:12px;line-height:1.55;color:var(--muted);word-break:keep-all}
@media (min-width:960px){
  .main{flex-direction:row;align-items:center;max-width:1180px;width:100%;margin:0 auto;padding:0 40px 40px;gap:56px}
  .scene{align-self:stretch;flex:1.3 1 0}
  .copy{flex:0 0 400px;padding:0}
  .line{font-size:28px}
}
/* ── 움직임(.is-play). 기본 상태 = 끝 장면 ── */
svg .fb{transform-box:fill-box}
.is-play .copy .line{animation:rise .6s .8s var(--ease) both}
.is-play .copy .foot{animation:fadeIn .6s 1.1s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fadeIn{from{opacity:0}}
/* 문에 비친 복자 그림자: 왼쪽에서 문틈 쪽으로 걸어와 사라진다 */
#shadow{opacity:0}
.is-play #shadow{animation:shadowWalk 1.5s 0s ease-in-out both}
@keyframes shadowWalk{
  0%{opacity:.55;transform:translate(-92px,0)}
  15%{transform:translate(-80px,-3px)}30%{transform:translate(-62px,0)}45%{transform:translate(-44px,-3px)}60%{transform:translate(-26px,0)}75%{opacity:.55;transform:translate(-10px,-2px)}
  100%{opacity:0;transform:translate(0,0)}}
/* 미닫이: 머리로 밀어 틈 → 잠깐 멈춤 → 활짝(기본 = 열린 끝 장면). 문짝은 두껍닫이(벽 속)로 들어간다 */
#panel-l{transform:translateX(-150px)}#panel-r{transform:translateX(150px)}
.is-play #panel-l{animation:openL 2.2s 1.2s both}
.is-play #panel-r{animation:openR 2.2s 1.2s both}
@keyframes openL{0%{transform:none;animation-timing-function:cubic-bezier(.3,1.4,.6,1)}18%{transform:translateX(-22px)}40%{transform:translateX(-22px);animation-timing-function:cubic-bezier(.5,0,.2,1)}100%{transform:translateX(-150px)}}
@keyframes openR{0%{transform:none;animation-timing-function:cubic-bezier(.3,1.4,.6,1)}18%{transform:translateX(22px)}40%{transform:translateX(22px);animation-timing-function:cubic-bezier(.5,0,.2,1)}100%{transform:translateX(150px)}}
/* 복자 머리: 문틈으로 쑥 */
#bk-head{transform-origin:50% 100%}
.is-play #bk-head{animation:poke 2.2s 1.2s both}
@keyframes poke{0%{opacity:0;transform:translateY(10px) scale(.9)}8%{opacity:1}18%{transform:translateY(-3px) rotate(-4deg)}28%{transform:rotate(5deg)}40%{transform:rotate(-2deg)}55%,100%{opacity:1;transform:none}}
#bk-earR{transform-origin:30% 100%}
.is-play #bk-earR{animation:ear .4s 1.9s ease-in-out both}
@keyframes ear{0%,100%{transform:none}50%{transform:rotate(16deg)}}
#bk-eyes{transform-origin:50% 50%}
.is-play #bk-eyes{animation:slowBlink 1s 4.2s ease-in-out both}
@keyframes slowBlink{0%,100%{transform:none}35%,55%{transform:scaleY(.12)}}
#bk-tail{transform-origin:0% 0%}
.is-play #bk-tail{animation:tail 1.2s 3.4s ease-in-out both}
@keyframes tail{0%{transform:rotate(-30deg)}60%{transform:rotate(6deg)}100%{transform:none}}
/* 방 안: 할머니 끄덕, 등잔 흔들림, 찻김 */
#hm-head{transform-origin:50% 92%}
.is-play #hm-head{animation:nod 1s 3.2s ease-in-out both}
@keyframes nod{0%,100%{transform:none}40%{transform:rotate(-4deg) translateY(1px)}75%{transform:rotate(1.5deg)}}
#flame{transform-origin:50% 100%}
.is-play #flame{animation:flicker .9s 2.4s ease-in-out 2}
@keyframes flicker{0%,100%{transform:none}30%{transform:scale(.92,1.08) skewX(-3deg)}60%{transform:scale(1.05,.95) skewX(2deg)}}
.steam path{stroke-dasharray:40;stroke-dashoffset:0}
.is-play .steam path{animation:steam 1.8s 2.6s ease-out 2 both}
.is-play .steam path+path{animation-delay:2.9s}
@keyframes steam{0%{stroke-dashoffset:40;opacity:0;transform:translateY(4px)}40%{opacity:1}100%{stroke-dashoffset:0;opacity:1;transform:none}}
/* ── 압축본(기본, 약 2.8초): 그림자 걷기를 빼고 0.4초 안에 복자 머리가 문틈으로 ── */
.cut-short.is-play .copy .line{animation-delay:.3s;animation-duration:.45s}
.cut-short.is-play .copy .foot{animation-delay:.5s}
.cut-short.is-play #shadow{animation:none}
.cut-short.is-play #panel-l,.cut-short.is-play #panel-r,.cut-short.is-play #bk-head{animation-duration:1.5s;animation-delay:.12s}
.cut-short.is-play #bk-earR{animation-delay:.45s}
.cut-short.is-play #hm-head{animation-delay:1.45s;animation-duration:.8s}
.cut-short.is-play #flame{animation-delay:1.1s;animation-iteration-count:1}
.cut-short.is-play .steam path{animation-delay:1.25s;animation-duration:1.2s;animation-iteration-count:1}
.cut-short.is-play .steam path+path{animation-delay:1.4s}
.cut-short.is-play #bk-tail{animation-delay:1.5s;animation-duration:.9s}
.cut-short.is-play #bk-eyes{animation-delay:1.9s;animation-duration:.8s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
  /* 전체판 5.4초 · 압축본 2.8초. 압축 방식: CSS에 압축본 시간표를 따로 둠 */
  var FULL=5400, SHORT=2800, RATE=1;
  var h=document.documentElement, q=new URLSearchParams(location.search), btn=document.getElementById('ctl'), timer;
  var short=h.classList.contains('cut-short'), total=short?SHORT:FULL;
  function speed(){if(short&&RATE!==1)document.getAnimations().forEach(function(a){a.playbackRate=RATE;});}
  function mark(){try{localStorage.setItem('halmi-intro-seen','1');}catch(e){}}
  function done(){clearTimeout(timer);h.classList.remove('is-play');h.classList.add('is-done');btn.textContent='다시 보기';}
  function play(){clearTimeout(timer);h.classList.remove('is-done','is-revisit','is-play');void h.offsetWidth;h.classList.add('is-play');speed();btn.textContent='건너뛰기';timer=setTimeout(done,total);}
  btn.addEventListener('click',function(){h.classList.contains('is-play')?done():play();});
  window.replay=play; window.finish=done;
  addEventListener('message',function(e){if(e.data==='replay')play();});
  if(h.classList.contains('is-done')){btn.textContent='다시 보기';return;}
  var at=q.get('at'); /* 검수용: ?at=1500 화면 시계 1.5초 장면에서 멈춤, ?at=end 끝 장면 */
  if(at==='end'){done();return;}
  speed();
  if(at!==null){document.getAnimations().forEach(function(a){var r=a.playbackRate||1;a.pause();a.currentTime=+at*r;});return;}
  mark(); timer=setTimeout(done,total);
})();
</script>
